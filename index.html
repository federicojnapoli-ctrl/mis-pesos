<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<title>Pesos</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#14171c;
    --panel:#1d222a;
    --panel-2:#252b35;
    --line:#333b47;
    --ink:#eef1f5;
    --ink-dim:#8d97a6;
    --brass:#e3a13c;
    --brass-soft:#3a2f1c;
    --up:#5fbf7f;
    --down:#d97070;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px;
    line-height:1.4;
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased;
  }
  button,input,select{font:inherit;color:inherit}
  button{background:none;border:0;cursor:pointer}

  /* ---------- cabecera ---------- */
  header{
    position:sticky;top:0;z-index:20;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:calc(12px + env(safe-area-inset-top)) 16px 0;
  }
  .titulo{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    margin-bottom:10px;
  }
  .titulo h1{
    margin:0;font-size:22px;font-weight:800;letter-spacing:-0.02em;
  }
  .titulo .dia{font-size:13px;color:var(--ink-dim)}
  .menu-btn{
    font-size:20px;color:var(--ink-dim);padding:4px 8px;line-height:1;
  }
  nav{
    display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;
    scrollbar-width:none;
  }
  nav::-webkit-scrollbar{display:none}
  nav button{
    flex:0 0 auto;
    padding:8px 14px;border-radius:999px;
    background:var(--panel);border:1px solid var(--line);
    color:var(--ink-dim);font-size:15px;font-weight:600;
  }
  nav button[aria-current="true"]{
    background:var(--brass);border-color:var(--brass);color:#1a1509;
  }

  /* ---------- lista ---------- */
  main{padding:14px 16px 100px;display:flex;flex-direction:column;gap:12px}
  .ej{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 14px 12px;
  }
  .ej-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .ej-nombre{font-size:17px;font-weight:700;letter-spacing:-0.01em}
  .ej-tipo{
    display:inline-block;margin-top:3px;
    font-size:12px;color:var(--ink-dim);
  }
  .ej-menu{color:var(--ink-dim);font-size:18px;padding:0 6px;line-height:1}

  .fila{display:flex;align-items:center;gap:12px;margin-top:12px}
  .paso-btn{
    width:64px;height:64px;flex:0 0 auto;
    border-radius:16px;background:var(--panel-2);
    border:1px solid var(--line);
    font-size:28px;font-weight:600;color:var(--ink);
    display:flex;align-items:center;justify-content:center;
  }
  .paso-btn:active{background:var(--brass);color:#1a1509;border-color:var(--brass)}
  .peso{
    flex:1;text-align:center;padding:6px 0;
  }
  .peso b{
    display:block;
    font-size:42px;font-weight:800;line-height:1;
    font-variant-numeric:tabular-nums;letter-spacing:-0.03em;
  }
  .peso span{display:block;font-size:12px;color:var(--ink-dim);margin-top:4px}

  .ej-pie{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
    font-size:13px;color:var(--ink-dim);
  }
  .delta{font-weight:700;font-variant-numeric:tabular-nums}
  .delta.sube{color:var(--up)}
  .delta.baja{color:var(--down)}
  .ver-hist{color:var(--brass);font-size:13px;font-weight:600}
  .hist{margin-top:10px;display:none}
  .hist.abierta{display:block}
  .hist ul{list-style:none;margin:0;padding:0}
  .hist li{
    display:flex;justify-content:space-between;
    padding:6px 0;font-size:14px;color:var(--ink-dim);
    border-bottom:1px solid var(--panel-2);
  }
  .hist li b{color:var(--ink);font-variant-numeric:tabular-nums}

  .vacio{
    text-align:center;color:var(--ink-dim);padding:48px 20px;
    border:1px dashed var(--line);border-radius:var(--radius);
  }
  .vacio p{margin:0 0 14px}

  /* ---------- botón agregar ---------- */
  .agregar{
    position:fixed;left:16px;right:16px;
    bottom:calc(16px + env(safe-area-inset-bottom));
    height:54px;border-radius:16px;
    background:var(--brass);color:#1a1509;
    font-size:16px;font-weight:700;
    box-shadow:0 6px 20px rgba(0,0,0,.45);
    z-index:15;
  }

  /* ---------- modal ---------- */
  .fondo{
    position:fixed;inset:0;background:rgba(8,10,13,.72);
    display:none;align-items:flex-end;justify-content:center;z-index:40;
  }
  .fondo.abierto{display:flex}
  .modal{
    width:100%;max-width:520px;
    background:var(--panel);
    border:1px solid var(--line);border-bottom:0;
    border-radius:18px 18px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  }
  .modal h2{margin:0 0 14px;font-size:18px;font-weight:700}
  .campo{margin-bottom:12px}
  .campo label{display:block;font-size:13px;color:var(--ink-dim);margin-bottom:5px}
  .campo input,.campo select{
    width:100%;padding:12px;border-radius:12px;
    background:var(--panel-2);border:1px solid var(--line);
  }
  .campo input:focus,.campo select:focus{outline:2px solid var(--brass);outline-offset:1px}
  .duo{display:flex;gap:10px}
  .duo>*{flex:1}
  .acciones{display:flex;gap:10px;margin-top:16px}
  .acciones button{
    flex:1;height:48px;border-radius:12px;font-weight:700;
    background:var(--panel-2);border:1px solid var(--line);
  }
  .acciones .ok{background:var(--brass);color:#1a1509;border-color:var(--brass)}
  .acciones .borrar{background:transparent;color:var(--down);border-color:var(--down)}
  .aviso{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(84px + env(safe-area-inset-bottom));
    background:var(--panel-2);border:1px solid var(--line);
    padding:10px 16px;border-radius:999px;font-size:14px;
    opacity:0;pointer-events:none;transition:opacity .18s;z-index:50;
  }
  .aviso.visible{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="titulo">
    <h1>Pesos</h1>
    <button class="menu-btn" id="btnAjustes" aria-label="Ajustes">⋯</button>
  </div>
  <nav id="nav"></nav>
</header>

<main id="lista"></main>

<button class="agregar" id="btnAgregar">Agregar ejercicio</button>
<div class="aviso" id="aviso"></div>

<!-- modal ejercicio -->
<div class="fondo" id="fondoEj">
  <div class="modal">
    <h2 id="tituloEj">Nuevo ejercicio</h2>
    <div class="campo">
      <label for="fNombre">Ejercicio</label>
      <input id="fNombre" type="text" placeholder="Press banca" autocomplete="off">
    </div>
    <div class="duo">
      <div class="campo">
        <label for="fGrupo">Músculo</label>
        <select id="fGrupo"></select>
      </div>
      <div class="campo">
        <label for="fTipo">Tipo</label>
        <select id="fTipo">
          <option value="mancuerna">Mancuerna</option>
          <option value="apilado">Apilado</option>
          <option value="barra">Barra</option>
          <option value="corporal">Corporal / otro</option>
        </select>
      </div>
    </div>
    <div class="duo">
      <div class="campo">
        <label for="fPeso">Peso actual</label>
        <input id="fPeso" type="number" inputmode="decimal" step="0.5" value="0">
      </div>
      <div class="campo">
        <label for="fUnidad">Unidad</label>
        <select id="fUnidad">
          <option value="kg">kg</option>
          <option value="placas">placas</option>
        </select>
      </div>
    </div>
    <div class="campo">
      <label for="fPaso">Cuánto suma/resta cada toque</label>
      <input id="fPaso" type="number" inputmode="decimal" step="0.5" value="2.5">
    </div>
    <div class="acciones">
      <button id="btnCancelarEj">Cancelar</button>
      <button class="ok" id="btnGuardarEj">Guardar</button>
    </div>
    <div class="acciones" id="filaBorrar" style="display:none">
      <button class="borrar" id="btnBorrarEj">Borrar ejercicio</button>
    </div>
  </div>
</div>

<!-- modal peso exacto -->
<div class="fondo" id="fondoPeso">
  <div class="modal">
    <h2 id="tituloPeso">Peso</h2>
    <div class="campo">
      <label for="fPesoExacto">Escribí el peso</label>
      <input id="fPesoExacto" type="number" inputmode="decimal" step="0.5">
    </div>
    <div class="acciones">
      <button id="btnCancelarPeso">Cancelar</button>
      <button class="ok" id="btnGuardarPeso">Guardar</button>
    </div>
  </div>
</div>

<!-- modal ajustes -->
<div class="fondo" id="fondoAjustes">
  <div class="modal">
    <h2>Copia de seguridad</h2>
    <p style="margin:0 0 14px;font-size:14px;color:var(--ink-dim)">
      Los datos viven en este teléfono. Copiá el respaldo cada tanto para no perderlos si borrás los datos del navegador.
    </p>
    <div class="campo">
      <label for="fBackup">Respaldo</label>
      <input id="fBackup" type="text" readonly value="">
    </div>
    <div class="acciones">
      <button id="btnCopiar">Copiar respaldo</button>
      <button id="btnRestaurar">Restaurar</button>
    </div>
    <div class="acciones">
      <button id="btnCerrarAjustes">Cerrar</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var CLAVE = "pesos_v1";
  var GRUPOS = ["Pecho","Espalda","Piernas","Hombro","Bíceps","Tríceps"];

  var SEMILLA = [
    ["Press banca","Pecho","barra",40,2.5],
    ["Press inclinado mancuernas","Pecho","mancuerna",12,2],
    ["Aperturas en polea","Pecho","apilado",15,5],
    ["Dominadas asistidas","Espalda","apilado",30,5],
    ["Remo con mancuerna","Espalda","mancuerna",14,2],
    ["Polea al pecho","Espalda","apilado",35,5],
    ["Sentadilla","Piernas","barra",50,5],
    ["Prensa","Piernas","apilado",80,10],
    ["Curl femoral","Piernas","apilado",30,5],
    ["Press militar mancuernas","Hombro","mancuerna",10,2],
    ["Vuelos laterales","Hombro","mancuerna",6,1],
    ["Curl de bíceps mancuernas","Bíceps","mancuerna",10,2],
    ["Curl martillo","Bíceps","mancuerna",10,2],
    ["Tríceps en polea","Tríceps","apilado",20,5],
    ["Copa con mancuerna","Tríceps","mancuerna",12,2]
  ];

  var estado = cargar();
  var grupoActivo = estado.grupoActivo || GRUPOS[0];
  var editandoId = null;
  var pesoId = null;
  var abiertos = {};

  // ---------- datos ----------
  function nuevoId(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  }

  function cargar(){
    try{
      var crudo = localStorage.getItem(CLAVE);
      if(crudo){
        var d = JSON.parse(crudo);
        if(d && Array.isArray(d.ejercicios)) return d;
      }
    }catch(e){}
    return {v:1, grupoActivo:GRUPOS[0], ejercicios:SEMILLA.map(function(s){
      return {
        id:nuevoId(), nombre:s[0], grupo:s[1], tipo:s[2],
        peso:s[3], paso:s[4], unidad:"kg", hist:[]
      };
    })};
  }

  function guardar(){
    estado.grupoActivo = grupoActivo;
    try{
      localStorage.setItem(CLAVE, JSON.stringify(estado));
    }catch(e){
      avisar("No se pudo guardar en este navegador");
    }
  }

  function buscar(id){
    for(var i=0;i<estado.ejercicios.length;i++){
      if(estado.ejercicios[i].id===id) return estado.ejercicios[i];
    }
    return null;
  }

  function hoy(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var dd = String(d.getDate()).padStart(2,"0");
    return d.getFullYear()+"-"+m+"-"+dd;
  }

  function fechaCorta(iso){
    var p = iso.split("-");
    return p[2]+"/"+p[1];
  }

  function diasDesde(iso){
    var a = new Date(iso+"T00:00:00");
    var b = new Date(hoy()+"T00:00:00");
    return Math.round((b-a)/86400000);
  }

  function textoFecha(iso){
    var d = diasDesde(iso);
    if(d<=0) return "hoy";
    if(d===1) return "ayer";
    if(d<7) return "hace "+d+" días";
    return "el "+fechaCorta(iso);
  }

  // registra el peso del día; si ya hay registro de hoy, lo reemplaza
  function registrar(ej, valor){
    ej.peso = valor;
    var f = hoy();
    var ultimo = ej.hist[ej.hist.length-1];
    if(ultimo && ultimo.d===f) ultimo.p = valor;
    else ej.hist.push({d:f, p:valor});
    if(ej.hist.length>40) ej.hist = ej.hist.slice(-40);
    guardar();
  }

  function unidadDe(ej){ return ej.unidad==="placas" ? "placas" : "kg"; }

  function nombreTipo(ej){
    var t = {mancuerna:"Mancuerna", apilado:"Apilado", barra:"Barra", corporal:"Corporal"}[ej.tipo] || "Otro";
    return t + " · de a " + limpiar(ej.paso) + " " + unidadDe(ej);
  }

  function limpiar(n){
    return (Math.round(n*100)/100).toString().replace(".",",");
  }

  // ---------- render ----------
  var nav = document.getElementById("nav");
  var lista = document.getElementById("lista");

  function pintarNav(){
    nav.innerHTML = "";
    GRUPOS.forEach(function(g){
      var b = document.createElement("button");
      b.textContent = g;
      b.setAttribute("aria-current", g===grupoActivo ? "true" : "false");
      b.addEventListener("click", function(){
        grupoActivo = g;
        guardar();
        pintarNav();
        pintarLista();
        window.scrollTo(0,0);
      });
      nav.appendChild(b);
    });
  }

  function pintarLista(){
    lista.innerHTML = "";
    var items = estado.ejercicios.filter(function(e){ return e.grupo===grupoActivo; });

    if(!items.length){
      var v = document.createElement("div");
      v.className = "vacio";
      v.innerHTML = "<p>Todavía no hay ejercicios de "+grupoActivo.toLowerCase()+".</p>";
      var b = document.createElement("button");
      b.className = "ver-hist";
      b.textContent = "Agregar el primero";
      b.addEventListener("click", function(){ abrirEjercicio(null); });
      v.appendChild(b);
      lista.appendChild(v);
      return;
    }

    items.forEach(function(ej){
      lista.appendChild(tarjeta(ej));
    });
  }

  function tarjeta(ej){
    var card = document.createElement("div");
    card.className = "ej";

    var top = document.createElement("div");
    top.className = "ej-top";
    var izq = document.createElement("div");
    var n = document.createElement("div");
    n.className = "ej-nombre";
    n.textContent = ej.nombre;
    var t = document.createElement("div");
    t.className = "ej-tipo";
    t.textContent = nombreTipo(ej);
    izq.appendChild(n); izq.appendChild(t);
    var menu = document.createElement("button");
    menu.className = "ej-menu";
    menu.setAttribute("aria-label","Editar "+ej.nombre);
    menu.textContent = "⋯";
    menu.addEventListener("click", function(){ abrirEjercicio(ej.id); });
    top.appendChild(izq); top.appendChild(menu);
    card.appendChild(top);

    var fila = document.createElement("div");
    fila.className = "fila";

    var menos = document.createElement("button");
    menos.className = "paso-btn";
    menos.textContent = "−";
    menos.setAttribute("aria-label","Restar "+limpiar(ej.paso));
    menos.addEventListener("click", function(){ cambiar(ej, -ej.paso); });

    var caja = document.createElement("button");
    caja.className = "peso";
    caja.setAttribute("aria-label","Escribir peso exacto");
    var b = document.createElement("b");
    b.textContent = limpiar(ej.peso);
    var s = document.createElement("span");
    s.textContent = unidadDe(ej);
    caja.appendChild(b); caja.appendChild(s);
    caja.addEventListener("click", function(){ abrirPeso(ej.id); });

    var mas = document.createElement("button");
    mas.className = "paso-btn";
    mas.textContent = "+";
    mas.setAttribute("aria-label","Sumar "+limpiar(ej.paso));
    mas.addEventListener("click", function(){ cambiar(ej, ej.paso); });

    fila.appendChild(menos); fila.appendChild(caja); fila.appendChild(mas);
    card.appendChild(fila);

    // pie: última vez + diferencia
    var pie = document.createElement("div");
    pie.className = "ej-pie";
    var info = document.createElement("div");

    if(ej.hist.length){
      var ult = ej.hist[ej.hist.length-1];
      var previo = ej.hist.length>1 ? ej.hist[ej.hist.length-2] : null;
      info.textContent = "Guardado " + textoFecha(ult.d);
      if(previo){
        var dif = ult.p - previo.p;
        if(dif !== 0){
          var d = document.createElement("span");
          d.className = "delta " + (dif>0 ? "sube" : "baja");
          d.textContent = "  " + (dif>0?"+":"−") + limpiar(Math.abs(dif));
          info.appendChild(d);
        }
      }
    }else{
      info.textContent = "Sin registros todavía";
    }

    var ver = document.createElement("button");
    ver.className = "ver-hist";
    ver.textContent = abiertos[ej.id] ? "Ocultar" : "Historial";
    pie.appendChild(info); pie.appendChild(ver);
    card.appendChild(pie);

    var hist = document.createElement("div");
    hist.className = "hist" + (abiertos[ej.id] ? " abierta" : "");
    hist.appendChild(listaHistorial(ej));
    card.appendChild(hist);

    ver.addEventListener("click", function(){
      abiertos[ej.id] = !abiertos[ej.id];
      hist.classList.toggle("abierta", !!abiertos[ej.id]);
      ver.textContent = abiertos[ej.id] ? "Ocultar" : "Historial";
    });

    return card;
  }

  function listaHistorial(ej){
    var ul = document.createElement("ul");
    var ultimos = ej.hist.slice(-8).reverse();
    if(!ultimos.length){
      var li = document.createElement("li");
      li.textContent = "Cuando cambies el peso queda anotado acá.";
      ul.appendChild(li);
      return ul;
    }
    ultimos.forEach(function(h){
      var li = document.createElement("li");
      var f = document.createElement("span");
      f.textContent = fechaCorta(h.d);
      var p = document.createElement("b");
      p.textContent = limpiar(h.p) + " " + unidadDe(ej);
      li.appendChild(f); li.appendChild(p);
      ul.appendChild(li);
    });
    return ul;
  }

  function cambiar(ej, delta){
    var nuevo = Math.round((ej.peso + delta)*100)/100;
    if(nuevo < 0) nuevo = 0;
    registrar(ej, nuevo);
    pintarLista();
    if(navigator.vibrate) navigator.vibrate(8);
  }

  // ---------- avisos ----------
  var aviso = document.getElementById("aviso");
  var avisoTimer = null;
  function avisar(txt){
    aviso.textContent = txt;
    aviso.classList.add("visible");
    clearTimeout(avisoTimer);
    avisoTimer = setTimeout(function(){ aviso.classList.remove("visible"); }, 1800);
  }

  // ---------- modal ejercicio ----------
  var fondoEj = document.getElementById("fondoEj");
  var fNombre = document.getElementById("fNombre");
  var fGrupo = document.getElementById("fGrupo");
  var fTipo = document.getElementById("fTipo");
  var fPeso = document.getElementById("fPeso");
  var fUnidad = document.getElementById("fUnidad");
  var fPaso = document.getElementById("fPaso");
  var filaBorrar = document.getElementById("filaBorrar");

  GRUPOS.forEach(function(g){
    var o = document.createElement("option");
    o.value = g; o.textContent = g;
    fGrupo.appendChild(o);
  });

  function abrirEjercicio(id){
    editandoId = id;
    var ej = id ? buscar(id) : null;
    document.getElementById("tituloEj").textContent = ej ? "Editar ejercicio" : "Nuevo ejercicio";
    fNombre.value = ej ? ej.nombre : "";
    fGrupo.value = ej ? ej.grupo : grupoActivo;
    fTipo.value = ej ? ej.tipo : "mancuerna";
    fPeso.value = ej ? ej.peso : 0;
    fUnidad.value = ej ? unidadDe(ej) : "kg";
    fPaso.value = ej ? ej.paso : 2;
    filaBorrar.style.display = ej ? "flex" : "none";
    fondoEj.classList.add("abierto");
    if(!ej) setTimeout(function(){ fNombre.focus(); }, 60);
  }

  function cerrarEjercicio(){
    fondoEj.classList.remove("abierto");
    editandoId = null;
  }

  document.getElementById("btnAgregar").addEventListener("click", function(){ abrirEjercicio(null); });
  document.getElementById("btnCancelarEj").addEventListener("click", cerrarEjercicio);

  document.getElementById("btnGuardarEj").addEventListener("click", function(){
    var nombre = fNombre.value.trim();
    if(!nombre){ avisar("Poné un nombre"); fNombre.focus(); return; }
    var peso = parseFloat(fPeso.value);
    if(isNaN(peso) || peso < 0) peso = 0;
    var paso = parseFloat(fPaso.value);
    if(isNaN(paso) || paso <= 0) paso = 1;

    if(editandoId){
      var ej = buscar(editandoId);
      if(ej){
        ej.nombre = nombre;
        ej.grupo = fGrupo.value;
        ej.tipo = fTipo.value;
        ej.unidad = fUnidad.value;
        ej.paso = paso;
        if(peso !== ej.peso) registrar(ej, peso);
      }
    }else{
      estado.ejercicios.push({
        id:nuevoId(), nombre:nombre, grupo:fGrupo.value, tipo:fTipo.value,
        unidad:fUnidad.value, paso:paso, peso:peso,
        hist: peso>0 ? [{d:hoy(), p:peso}] : []
      });
      grupoActivo = fGrupo.value;
    }
    guardar();
    cerrarEjercicio();
    pintarNav();
    pintarLista();
    avisar("Listo");
  });

  document.getElementById("btnBorrarEj").addEventListener("click", function(){
    if(!editandoId) return;
    var ej = buscar(editandoId);
    if(!ej) return;
    if(!confirm("¿Borrar “"+ej.nombre+"” y su historial?")) return;
    estado.ejercicios = estado.ejercicios.filter(function(e){ return e.id!==editandoId; });
    guardar();
    cerrarEjercicio();
    pintarLista();
    avisar("Ejercicio borrado");
  });

  // ---------- modal peso exacto ----------
  var fondoPeso = document.getElementById("fondoPeso");
  var fPesoExacto = document.getElementById("fPesoExacto");

  function abrirPeso(id){
    pesoId = id;
    var ej = buscar(id);
    if(!ej) return;
    document.getElementById("tituloPeso").textContent = ej.nombre;
    fPesoExacto.value = ej.peso;
    fondoPeso.classList.add("abierto");
    setTimeout(function(){ fPesoExacto.focus(); fPesoExacto.select(); }, 60);
  }

  document.getElementById("btnCancelarPeso").addEventListener("click", function(){
    fondoPeso.classList.remove("abierto");
    pesoId = null;
  });

  document.getElementById("btnGuardarPeso").addEventListener("click", function(){
    var ej = buscar(pesoId);
    if(ej){
      var v = parseFloat(fPesoExacto.value);
      if(isNaN(v) || v<0) v = 0;
      registrar(ej, Math.round(v*100)/100);
      pintarLista();
    }
    fondoPeso.classList.remove("abierto");
    pesoId = null;
  });

  // ---------- ajustes / respaldo ----------
  var fondoAjustes = document.getElementById("fondoAjustes");
  var fBackup = document.getElementById("fBackup");

  document.getElementById("btnAjustes").addEventListener("click", function(){
    fBackup.value = JSON.stringify(estado);
    fondoAjustes.classList.add("abierto");
  });
  document.getElementById("btnCerrarAjustes").addEventListener("click", function(){
    fondoAjustes.classList.remove("abierto");
  });
  document.getElementById("btnCopiar").addEventListener("click", function(){
    fBackup.removeAttribute("readonly");
    fBackup.select();
    fBackup.setSelectionRange(0, 999999);
    var ok = false;
    try{ ok = document.execCommand("copy"); }catch(e){}
    fBackup.setAttribute("readonly","readonly");
    if(navigator.clipboard && !ok){
      navigator.clipboard.writeText(fBackup.value).then(function(){ avisar("Respaldo copiado"); });
    }else{
      avisar(ok ? "Respaldo copiado" : "Copialo a mano");
    }
  });
  document.getElementById("btnRestaurar").addEventListener("click", function(){
    var texto = prompt("Pegá el respaldo:");
    if(!texto) return;
    try{
      var d = JSON.parse(texto);
      if(!d || !Array.isArray(d.ejercicios)) throw new Error("formato");
      estado = d;
      grupoActivo = d.grupoActivo || GRUPOS[0];
      guardar();
      fondoAjustes.classList.remove("abierto");
      pintarNav();
      pintarLista();
      avisar("Datos restaurados");
    }catch(e){
      avisar("Ese respaldo no se pudo leer");
    }
  });

  // cerrar modales tocando el fondo
  [fondoEj, fondoPeso, fondoAjustes].forEach(function(f){
    f.addEventListener("click", function(ev){
      if(ev.target === f) f.classList.remove("abierto");
    });
  });

  // ---------- arranque ----------
  pintarNav();
  pintarLista();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
